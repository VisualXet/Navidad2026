<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Navidad 2026 · Modo Sencillo Compañeros (Móvil / Tablet)</title>
  <meta name="description" content="Acceso rápido para incorporar ideas, solicitudes, comidas, utensilios, decoración y consultar/actualizar el stock de la Fiesta de Navidad 2026." />

  <meta name="theme-color" content="#991b1b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Navidad 2026" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="img/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css?v=9" />
  <style>
    .topbar-left { flex-wrap: wrap !important; gap: 8px 12px !important; }
    .countdown-pill { display: inline-block !important; white-space: nowrap !important; flex-shrink: 0 !important; font-size: 13px !important; font-weight: 800 !important; padding: 5px 12px !important; line-height: 1.3 !important; }
    .quick-submit-btn, .quick-mobile-wrapper form button[type="submit"] { width: 100% !important; white-space: normal !important; word-break: break-word !important; text-align: center !important; line-height: 1.3 !important; padding: 13px 16px !important; font-size: 15px !important; }
    html[data-theme="dark"], body.dark-theme {
      --bg-body: #0b1120 !important; --bg-surface: #1e293b !important; --bg-subtle: #0f172a !important;
      --text-main: #f8fafc !important; --text-muted: #cbd5e1 !important; --text-light: #94a3b8 !important;
      --border-color: #334155 !important; --border-strong: #475569 !important;
      background-color: #0b1120 !important; color: #f8fafc !important;
    }
    html[data-theme="dark"] .panel-card, html[data-theme="dark"] .modal-box, html[data-theme="dark"] .quick-user-bar,
    html[data-theme="dark"] .quick-big-tab:not(.active), html[data-theme="dark"] .quick-feed-item, html[data-theme="dark"] .quick-stock-card {
      background: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important;
    }
    html[data-theme="dark"] .quick-type-btn:not(.active), html[data-theme="dark"] .quick-user-btn:not(.active),
    html[data-theme="dark"] .btn-secondary, html[data-theme="dark"] .form-control, html[data-theme="dark"] .search-input,
    html[data-theme="dark"] .stepper-btn:not(.plus) {
      background: #0f172a !important; color: #f8fafc !important; border-color: #475569 !important;
    }
  </style>
  <script>
    window.applyNavidadTheme = function (theme) {
      var isDark = theme === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark-theme', isDark);
      if (document.body) {
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.body.classList.toggle('dark-theme', isDark);
      }
      var btns = document.querySelectorAll('#theme-toggle-btn, .theme-toggle-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].innerHTML = isDark ? '☀️ Claro' : '🌙 Oscuro';
      }
    };
    window.toggleNavidadTheme = function () {
      var cur = localStorage.getItem('navidad2026_theme') || 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem('navidad2026_theme', next);
      if (window.App) window.App.theme = next;
      window.applyNavidadTheme(next);
    };
    document.addEventListener('DOMContentLoaded', function () {
      window.applyNavidadTheme(localStorage.getItem('navidad2026_theme') || 'light');
    });
  </script>
</head>
<body data-mode="movil-only">

  <!-- CABECERA ULTRA SENCILLA PARA TELÉFONO Y TABLET -->
  <header class="topbar" style="background:linear-gradient(90deg,#0f172a 0%,#7f1d1d 100%);color:#fff;border-bottom:none;">
    <div class="topbar-left">
      <img src="img/icon.svg" alt="Navidad 2026" style="width:36px;height:36px;border-radius:8px;" />
      <div>
        <div style="font-weight:900;font-size:15.5px;color:#fde047;line-height:1.15;">🎄 NAVIDAD 2026</div>
        <div style="font-size:11.5px;color:#e2e8f0;">Aportaciones Rápidas y Stock · 18 Dic</div>
      </div>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn btn-secondary btn-sm theme-toggle-btn" id="theme-toggle-btn" onclick="window.toggleNavidadTheme()"
        title="Cambiar entre modo oscuro y claro" style="font-weight:800;">
        🌙 Oscuro
      </button>

      <button class="btn btn-secondary btn-sm" onclick="App.openAuthModal()" title="Configurar usuario o PIN">
        👤 <span id="topbar-user-label">TeTe</span> ⚙️
      </button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL MÓVIL / TABLET -->
  <main class="content-container" id="main-view-container" style="padding-top:14px;padding-bottom:40px;">
    <!-- Se inyecta dinámicamente desde js/app.js (renderQuickMobileView) -->
  </main>

  <!-- MODAL UNIVERSAL CRUD (Para editar algún detalle si se desea) -->
  <div class="modal-backdrop" id="crud-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="crud-modal-title">Editar Registro</h3>
        <button class="btn btn-secondary btn-sm" onclick="App.closeCrudModal()">✕</button>
      </div>
      <form id="crud-form" onsubmit="App.saveCrudForm(event)">
        <div class="modal-body" id="crud-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="crud-delete-btn" style="margin-right:auto;display:none;" onclick="App.deleteCrudRecord()">
            🗑️ Eliminar
          </button>
          <button type="button" class="btn btn-secondary" onclick="App.closeCrudModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE IDENTIFICACIÓN DE USUARIO Y CLAVE PIN -->
  <div class="modal-backdrop" id="auth-modal">
    <div class="modal-box" style="max-width:480px;">
      <div class="modal-header">
        <h3 class="modal-title">🔐 ¿Quién eres? y PIN del Equipo</h3>
        <button class="btn btn-secondary btn-sm" onclick="App.closeAuthModal()">✕</button>
      </div>
      <form onsubmit="App.saveAuthModal(event)">
        <div class="modal-body">
          <div class="form-group">
            <label for="auth-user-name-input">1. ¿Quién eres? (Selecciona tu perfil o escribe tu nombre)</label>
            <div id="auth-user-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px;"></div>
            <input
              type="text"
              id="auth-user-name-input"
              class="form-control"
              style="margin-top:6px;"
              placeholder="Selecciona un botón arriba o escribe quién eres"
              oninput="App.handleUserNameInput(this.value)"
            />
          </div>

          <div class="form-group" style="margin-top:8px;">
            <label for="auth-pin-input">2. PIN / Clave de Acceso del Equipo (Sincronización Nube GitHub)</label>
            <input
              type="password"
              id="auth-pin-input"
              class="form-control"
              placeholder="Introduce el PIN de 6 dígitos (ej. 123456)"
              autocomplete="current-password"
            />
          </div>

          <div id="auth-status-box" style="padding:10px 12px;border-radius:8px;font-size:12.5px;background:#f8fafc;border:1px solid #cbd5e1;">
            Estado actual: Comprobando credenciales...
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="App.closeAuthModal()">Cerrar</button>
          <button type="submit" class="btn btn-primary">✅ Activar y Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE SUBIDA DE FACTURAS Y DOCUMENTOS DE CONSULTA -->
  <div class="modal-backdrop" id="doc-upload-modal">
    <div class="modal-box" style="max-width:680px;">
      <div class="modal-header">
        <h3 class="modal-title">📤 Subir Factura o Foto (Solo Consulta)</h3>
        <button class="btn btn-secondary btn-sm" onclick="DocsModule.closeUploadModal()">✕</button>
      </div>
      <form onsubmit="DocsModule.saveUploadedDocument(event)">
        <div class="modal-body" id="doc-upload-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="DocsModule.closeUploadModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="doc-upload-submit-btn">💾 Archivar y Consultar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL VISUALIZADOR INTERACTIVO DE DOCUMENTOS (ZOOM, ROTACIÓN Y DESPLAZAMIENTO H/V + RESUMEN) -->
  <div class="modal-backdrop" id="doc-viewer-modal">
    <div class="doc-viewer-shell" id="doc-viewer-modal-content"></div>
  </div>

  <section id="print-document" aria-hidden="true"></section>
  <script src="js/docs-module.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
